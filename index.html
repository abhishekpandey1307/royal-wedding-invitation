<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#7e1220"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Veer &amp; Aanya — A Royal Indian Wedding</title>
  <meta name="description" content="You are invited — Veer & Aanya, Saturday 12 December 2026, The Rambagh Palace, Jaipur."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Rozha+One&family=Marcellus&display=swap" rel="stylesheet"/>
  <link rel="preload" as="image" href="assets/invitation/hand-divine.webp" fetchpriority="high"/>
  <link rel="preload" as="image" href="assets/invitation/hand-bridal.webp" fetchpriority="high"/>
  <link rel="preload" as="image" href="assets/invitation/petals/pink_petal_1.webp" fetchpriority="low"/>
  <link rel="preload" as="image" href="assets/invitation/petals/pink_petal_2.webp" fetchpriority="low"/>
  <link rel="preload" as="image" href="assets/invitation/petals/pink_petal_3.webp" fetchpriority="low"/>
  <link rel="stylesheet" href="styles.css?v=20261031_03"/>
</head>
<body>

  <!-- Loading veil: covers everything until assets ready -->
  <div id="veil" class="veil" aria-hidden="true">
    <div class="veil-inner">
      <div class="veil-om">ॐ</div>
      <div class="veil-line"></div>
    </div>
  </div>

  <!-- Scroll progress hint -->
  <div id="scroll-hint" class="scroll-hint" aria-label="Scroll to reveal">
    <span class="scroll-hint-text">Scroll to Unveil</span>
    <div class="scroll-hint-arrow" aria-hidden="true"></div>
  </div>

  <!-- Audio -->
  <button id="audio-btn" class="audio-btn" type="button" aria-label="Play music">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="audio-icon">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
    <span class="audio-ring"></span>
  </button>

  <main class="stage" id="stage" role="main">

    <!-- Scene: the full-viewport composition -->
    <div class="scene" id="scene">

      <!-- Layer 1: Champagne ivory textured base -->
      <div class="paper-bg" aria-hidden="true"></div>

      <!-- Layer 1b: Dedicated Top & Bottom 24K Gold Mandalas — 100% Guaranteed Viewport Framing on ALL Devices -->
      <div class="mandala-frame mandala-top" aria-hidden="true">
        <picture>
          <source srcset="assets/invitation/mandala-top-retina_lossless.webp" type="image/webp"/>
          <img src="assets/invitation/mandala-top-retina.png" alt="" draggable="false" loading="lazy"/>
        </picture>
      </div>
      <div class="mandala-frame mandala-bot" aria-hidden="true">
        <picture>
          <source srcset="assets/invitation/mandala-bot-retina_lossless.webp" type="image/webp"/>
          <img src="assets/invitation/mandala-bot-retina.png" alt="" draggable="false" loading="lazy"/>
        </picture>
      </div>

      <!-- Layer 2: Atmospheric vignette -->
      <div class="vignette" aria-hidden="true"></div>

      <!-- Layer 3: Gold dust canvas -->
      <canvas id="dust" class="dust-canvas" aria-hidden="true"></canvas>

      <!-- Layer 4: Inner folio container — strictly clips arms inside the border frame so NO pixels bleed into margins -->
      <div id="scene-inner" class="scene-inner" aria-hidden="true">
        <!-- Divine hand — upper right, descends diagonally on scroll -->
        <div id="hand-divine" class="hand hand-divine">
          <picture>
            <source srcset="assets/invitation/hand-divine.webp" type="image/webp"/>
            <img src="assets/invitation/hand-divine.png" alt="" draggable="false"/>
          </picture>
          <!-- Lotus glow behind it -->
          <div class="lotus-glow" id="lotus-glow"></div>
          <!-- Anchor point for petal origin at lotus blossom -->
          <div class="flower-anchor" id="flower-anchor" aria-hidden="true"></div>
        </div>

        <!-- Bridal hand — lower left, rises diagonally on scroll -->
        <div id="hand-bridal" class="hand hand-bridal">
          <picture>
            <source srcset="assets/invitation/hand-bridal.webp" type="image/webp"/>
            <img src="assets/invitation/hand-bridal.png" alt="" draggable="false"/>
          </picture>
          <!-- Anchor point for petal destination at henna palm -->
          <div class="palm-anchor" id="palm-anchor" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Layer 5: Ultra-Realistic Falling Rose & Lotus Petals Canvas -->
      <canvas id="petals-canvas" class="petals-canvas" aria-hidden="true"></canvas>

      <!-- Layer 7: Central typography — Royal Wedding Monogram & Names Hero -->
      <div id="invite-text" class="invite-text" aria-label="Veer &amp; Aanya">

        <!-- Royal Header: Monogram Crest & Sanskrit Invocation (Positioned Above Center) -->
        <div class="invite-header">
          <!-- Royal Wedding Monogram Crest -->
          <div id="royal-crest" class="royal-crest" aria-hidden="true">
            <svg viewBox="0 0 160 80" class="crest-svg">
              <defs>
                <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#7a5416"/>
                  <stop offset="30%" stop-color="#c9a030"/>
                  <stop offset="50%" stop-color="#faebaa"/>
                  <stop offset="70%" stop-color="#c9a030"/>
                  <stop offset="100%" stop-color="#5c3d00"/>
                </linearGradient>
              </defs>
              <!-- Arch flourish -->
              <path d="M 30,55 Q 80,10 130,55" fill="none" stroke="url(#crestGold)" stroke-width="1.2" opacity="0.85"/>
              <path d="M 45,58 Q 80,24 115,58" fill="none" stroke="url(#crestGold)" stroke-width="0.8" opacity="0.6"/>
              <!-- Center crown diamond -->
              <polygon points="80,12 85,20 80,28 75,20" fill="url(#crestGold)"/>
              <circle cx="80" cy="20" r="2" fill="#8f1d2c"/>
              <!-- Monogram Letters V · A -->
              <text x="80" y="56" text-anchor="middle" class="crest-letters" fill="url(#crestGold)">V · A</text>
              <!-- Ornamental dots -->
              <circle cx="58" cy="52" r="1.5" fill="url(#crestGold)"/>
              <circle cx="102" cy="52" r="1.5" fill="url(#crestGold)"/>
            </svg>
          </div>

          <!-- Sanskrit invocation -->
          <p id="txt-invocation" class="txt-invocation">
            <span class="inv-rule"></span>
            <span class="inv-text">|| श्री गणेशाय नमः ||</span>
            <span class="inv-rule"></span>
          </p>
        </div>

        <!-- Couple names — Monumental Royal Typography with Letter-by-Letter Calligraphic Writing Reveal -->
        <div id="txt-names" class="txt-names" role="heading" aria-level="1">
          <!-- Groom: Veer -->
          <div class="partner-unit partner-groom">
            <div class="name-group" id="grp-groom" aria-label="Veer">
              <span class="cl" data-char="V"><span class="cl-glyph">V</span><span class="cl-nib"></span></span>
              <span class="cl" data-char="E"><span class="cl-glyph">E</span><span class="cl-nib"></span></span>
              <span class="cl" data-char="E"><span class="cl-glyph">E</span><span class="cl-nib"></span></span>
              <span class="cl" data-char="R"><span class="cl-glyph">R</span><span class="cl-nib"></span></span>
            </div>
            <span class="partner-side" id="side-groom">वर &bull; The Groom</span>
          </div>

          <!-- Ampersand -->
          <div class="name-amp" id="txt-amp" aria-hidden="true">
            <span class="cl" data-char="&amp;"><span class="cl-glyph">&amp;</span><span class="cl-nib"></span></span>
          </div>

          <!-- Bride: Aanya -->
          <div class="partner-unit partner-bride">
            <div class="name-group" id="grp-bride" aria-label="Aanya">
              <span class="cl" data-char="A"><span class="cl-glyph">A</span><span class="cl-nib"></span></span>
              <span class="cl" data-char="A"><span class="cl-glyph">A</span><span class="cl-nib"></span></span>
              <span class="cl" data-char="N"><span class="cl-glyph">N</span><span class="cl-nib"></span></span>
              <span class="cl" data-char="Y"><span class="cl-glyph">Y</span><span class="cl-nib"></span></span>
              <span class="cl" data-char="A"><span class="cl-glyph">A</span><span class="cl-nib"></span></span>
            </div>
            <span class="partner-side" id="side-bride">वधू &bull; The Bride</span>
          </div>
        </div>

      </div><!-- /invite-text -->

    </div><!-- /scene -->
  </main>

  <script src="wedding-data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="invitation.js?v=20261031_03"></script>
</body>
</html>
