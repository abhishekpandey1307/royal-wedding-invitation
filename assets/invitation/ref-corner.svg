<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7a5c10"/>
      <stop offset="28%"  stop-color="#c4a040"/>
      <stop offset="55%"  stop-color="#f5e98a"/>
      <stop offset="78%"  stop-color="#c4a040"/>
      <stop offset="100%" stop-color="#7a5c10"/>
    </linearGradient>
  </defs>

  <!-- ═══ OUTER L-BRACKET (top + left edges) ═══ -->
  <line x1="0"    y1="1.5" x2="90"   y2="1.5" stroke="url(#gC)" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="1.5"  y1="0"   x2="1.5"  y2="90"  stroke="url(#gC)" stroke-width="1.5" stroke-linecap="square"/>

  <!-- Outer corner diamond accent -->
  <rect x="-2.5" y="-2.5" width="5" height="5"
        transform="rotate(45 1.5 1.5)" fill="url(#gC)"/>

  <!-- ═══ INNER L-BRACKET (inset 14px) ═══ -->
  <line x1="14"  y1="14"  x2="90"  y2="14"  stroke="url(#gC)" stroke-width="1"   stroke-linecap="square"/>
  <line x1="14"  y1="14"  x2="14"  y2="90"  stroke="url(#gC)" stroke-width="1"   stroke-linecap="square"/>

  <!-- ═══ INNER JUNCTION 4-PETAL LOTUS at (14,14) ═══ -->
  <!-- N petal -->
  <path d="M 14,8.5 C 11.5,11 11.5,13.5 14,14 C 16.5,13.5 16.5,11 14,8.5 Z" fill="url(#gC)"/>
  <!-- E petal -->
  <path d="M 19.5,14 C 17,11.5 14.5,11.5 14,14 C 14.5,16.5 17,16.5 19.5,14 Z" fill="url(#gC)"/>
  <!-- S petal -->
  <path d="M 14,19.5 C 11.5,17 11.5,14.5 14,14 C 16.5,14.5 16.5,17 14,19.5 Z" fill="url(#gC)"/>
  <!-- W petal -->
  <path d="M 8.5,14 C 11,11.5 13.5,11.5 14,14 C 13.5,16.5 11,16.5 8.5,14 Z" fill="url(#gC)"/>
  <!-- center -->
  <circle cx="14" cy="14" r="2.3" fill="#fdf4c0"/>
  <circle cx="14" cy="14" r="1.1" fill="url(#gC)"/>

  <!-- ═══ LOTUS BUD FINIAL at horizontal arm end (~x=79, y=14) ═══ -->
  <!-- main bud -->
  <path d="M 79,10.5 C 76.5,11.5 76,13 77,14 C 76,15 76.5,16.5 79,17.5
            C 81.5,16.5 82,15 81,14 C 82,13 81.5,11.5 79,10.5 Z"
        fill="none" stroke="url(#gC)" stroke-width="0.85"/>
  <!-- left side-petal -->
  <path d="M 76,12.5 C 73.5,12 73,14 76,14" fill="none" stroke="url(#gC)" stroke-width="0.7" opacity="0.85"/>
  <path d="M 76,15.5 C 73.5,16 73,14 76,14" fill="none" stroke="url(#gC)" stroke-width="0.7" opacity="0.85"/>
  <!-- center dot -->
  <circle cx="79" cy="14" r="1.3" fill="url(#gC)"/>

  <!-- ═══ LOTUS BUD FINIAL at vertical arm end (~y=79, x=14) ═══ -->
  <!-- main bud (rotated 90°) -->
  <path d="M 10.5,79 C 11.5,76.5 13,76 14,77 C 15,76 16.5,76.5 17.5,79
            C 16.5,81.5 15,82 14,81 C 13,82 11.5,81.5 10.5,79 Z"
        fill="none" stroke="url(#gC)" stroke-width="0.85"/>
  <!-- top side-petal -->
  <path d="M 12.5,76 C 12,73.5 14,73 14,76" fill="none" stroke="url(#gC)" stroke-width="0.7" opacity="0.85"/>
  <path d="M 15.5,76 C 16,73.5 14,73 14,76" fill="none" stroke="url(#gC)" stroke-width="0.7" opacity="0.85"/>
  <!-- center dot -->
  <circle cx="14" cy="79" r="1.3" fill="url(#gC)"/>

  <!-- ═══ SMALL SCROLL ORNAMENTS near inner junction ═══ -->
  <!-- horizontal scroll (along inner bracket, ~x=25–36) -->
  <path d="M 24,14 Q 27,10.5 30.5,12 Q 34,13.5 30.5,15 Q 27,16.5 24,14"
        fill="none" stroke="url(#gC)" stroke-width="0.65" opacity="0.6"/>
  <!-- vertical scroll (along inner bracket, ~y=25–36) -->
  <path d="M 14,24 Q 10.5,27 12,30.5 Q 13.5,34 15,30.5 Q 16.5,27 14,24"
        fill="none" stroke="url(#gC)" stroke-width="0.65" opacity="0.6"/>
</svg>
