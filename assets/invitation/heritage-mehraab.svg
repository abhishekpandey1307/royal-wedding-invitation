<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="100%" height="100%">
  <defs>
    <linearGradient id="gMh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5416" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#b88924"/>
      <stop offset="50%" stop-color="#faebaa"/>
      <stop offset="80%" stop-color="#b88924"/>
      <stop offset="100%" stop-color="#7a5416" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="gRmh" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f03e56"/>
      <stop offset="50%" stop-color="#b01326"/>
      <stop offset="100%" stop-color="#4a040d"/>
    </radialGradient>
  </defs>

  <!-- 5-Lobed Scalloped Rambagh Mehraab Archway -->
  <!-- Outer Arch -->
  <path d="M 12,2 Q 35,4 48,12 Q 62,18 80,18 Q 98,18 112,12 Q 125,4 148,2" fill="none" stroke="url(#gMh)" stroke-width="1.4"/>
  <!-- Middle Arch with Cusps -->
  <path d="M 24,2 Q 42,7 54,16 Q 66,22 80,22 Q 94,22 106,16 Q 118,7 136,2" fill="none" stroke="url(#gMh)" stroke-width="0.8" opacity="0.8"/>
  <!-- Inner Cusped Scallops (5 Lobes) -->
  <path d="M 38,2 Q 48,10 58,18 Q 68,26 80,26 Q 92,26 102,18 Q 112,10 122,2" fill="none" stroke="url(#gMh)" stroke-width="1.2" opacity="0.95"/>

  <!-- Sacred Royal Lotus Crown Finial at apex (x=80, y=2) -->
  <polygon points="80,1 85,8 80,15 75,8" fill="url(#gMh)"/>
  <path d="M 73,8 Q 80,3 87,8" fill="none" stroke="url(#gMh)" stroke-width="0.8"/>
  <!-- Imperial Ruby Gemstone at crown center -->
  <circle cx="80" cy="8" r="2.8" fill="url(#gRmh)" stroke="url(#gMh)" stroke-width="0.5"/>
  <circle cx="79.1" cy="7.1" r="0.7" fill="#ffffff" opacity="0.85"/>

  <!-- Symmetrical Moti Pearls along the cusps -->
  <circle cx="80" cy="26" r="1.4" fill="url(#gMh)"/>
  <circle cx="68" cy="22" r="1.2" fill="url(#gMh)"/>
  <circle cx="92" cy="22" r="1.2" fill="url(#gMh)"/>
  <circle cx="58" cy="16" r="1.1" fill="url(#gMh)"/>
  <circle cx="102" cy="16" r="1.1" fill="url(#gMh)"/>
  <circle cx="46" cy="10" r="1.0" fill="url(#gMh)"/>
  <circle cx="114" cy="10" r="1.0" fill="url(#gMh)"/>

  <!-- Hanging Natural Pearl Droplet at apex -->
  <line x1="80" y1="26" x2="80" y2="31" stroke="url(#gMh)" stroke-width="0.8"/>
  <circle cx="80" cy="32.5" r="1.5" fill="url(#gMh)"/>
</svg>