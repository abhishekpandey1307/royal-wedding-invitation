<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e4a10"/>
      <stop offset="18%" stop-color="#b88924"/>
      <stop offset="38%" stop-color="#faebaa"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="78%" stop-color="#b88924"/>
      <stop offset="100%" stop-color="#543600"/>
    </linearGradient>
    <radialGradient id="gRuby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f03e56"/>
      <stop offset="45%" stop-color="#b01326"/>
      <stop offset="85%" stop-color="#6e0614"/>
      <stop offset="100%" stop-color="#3d0008"/>
    </radialGradient>
    <linearGradient id="gShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebaa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a6218" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- ── 1. Outer Framing Rules & Pearl String (Moti Mala) ── -->
  <!-- Outer hairline -->
  <path d="M 0,98 L 0,0 L 98,0" fill="none" stroke="url(#gGold)" stroke-width="1.6"/>
  <!-- Middle hairline -->
  <path d="M 4,94 L 4,4 L 94,4" fill="none" stroke="url(#gGold)" stroke-width="0.8" opacity="0.85"/>
  <!-- Moti (Pearl) String along (x=8, y=8) channel -->
  <path d="M 12,90 L 12,12 L 90,12" fill="none" stroke="url(#gGold)" stroke-width="0.8" opacity="0.85"/>
  <!-- Individual Pearl Beads in outer channel -->
  <g fill="url(#gGold)">
    <circle cx="8" cy="8" r="1.6"/>
    <circle cx="16" cy="8" r="1.2"/><circle cx="24" cy="8" r="1.2"/><circle cx="32" cy="8" r="1.2"/>
    <circle cx="40" cy="8" r="1.2"/><circle cx="48" cy="8" r="1.2"/><circle cx="56" cy="8" r="1.2"/>
    <circle cx="64" cy="8" r="1.2"/><circle cx="72" cy="8" r="1.2"/><circle cx="80" cy="8" r="1.2"/>
    <circle cx="88" cy="8" r="1.2"/><circle cx="96" cy="8" r="1.2"/>
    <circle cx="8" cy="16" r="1.2"/><circle cx="8" cy="24" r="1.2"/><circle cx="8" cy="32" r="1.2"/>
    <circle cx="8" cy="40" r="1.2"/><circle cx="8" cy="48" r="1.2"/><circle cx="8" cy="56" r="1.2"/>
    <circle cx="8" cy="64" r="1.2"/><circle cx="8" cy="72" r="1.2"/><circle cx="8" cy="80" r="1.2"/>
    <circle cx="8" cy="88" r="1.2"/><circle cx="8" cy="96" r="1.2"/>
  </g>

  <!-- ── 2. Corner Nexus: 8-Petaled Royal Rosette with Ruby Cabochon at (18,18) ── -->
  <circle cx="18" cy="18" r="6.5" fill="none" stroke="url(#gGold)" stroke-width="1.0"/>
  <!-- 8 Petals radiating from (18,18) -->
  <path d="M 18,11.5 Q 20.5,14 18,16.5 Q 15.5,14 18,11.5 Z" fill="url(#gGold)"/>
  <path d="M 18,19.5 Q 20.5,22 18,24.5 Q 15.5,22 18,19.5 Z" fill="url(#gGold)"/>
  <path d="M 11.5,18 Q 14,20.5 16.5,18 Q 14,15.5 11.5,18 Z" fill="url(#gGold)"/>
  <path d="M 19.5,18 Q 22,20.5 24.5,18 Q 22,15.5 19.5,18 Z" fill="url(#gGold)"/>
  <!-- Diagonal Petals -->
  <circle cx="14" cy="14" r="1.2" fill="url(#gGold)"/>
  <circle cx="22" cy="14" r="1.2" fill="url(#gGold)"/>
  <circle cx="14" cy="22" r="1.2" fill="url(#gGold)"/>
  <circle cx="22" cy="22" r="1.2" fill="url(#gGold)"/>
  <!-- Central Faceted Ruby Gemstone -->
  <circle cx="18" cy="18" r="3.2" fill="url(#gRuby)" stroke="url(#gGold)" stroke-width="0.7"/>
  <circle cx="16.9" cy="16.9" r="0.7" fill="#ffffff" opacity="0.85"/>

  <!-- ── 3. Concentric Scalloped Rajput Mehraab Arches from (0,0) ── -->
  <!-- Inner Scalloped Cusped Arch (R=34) -->
  <path d="M 0,34 Q 8,33 13,30 Q 20,30 25,25 Q 30,20 30,13 Q 33,8 34,0" fill="none" stroke="url(#gGold)" stroke-width="1.2"/>
  
  <!-- Middle Scalloped Jharokha Arch (R=52) with Pearl Inlay -->
  <path d="M 0,52 Q 12,50 19,46 Q 30,46 38,38 Q 46,30 46,19 Q 50,12 52,0" fill="none" stroke="url(#gGold)" stroke-width="1.4"/>
  <path d="M 0,48 Q 11,46 17,42 Q 28,42 35,35 Q 42,28 42,17 Q 46,11 48,0" fill="none" stroke="url(#gGold)" stroke-width="0.7" opacity="0.75"/>
  <!-- Pearls along R=48 -->
  <g fill="url(#gGold)">
    <circle cx="10" cy="45" r="1.1"/>
    <circle cx="22" cy="40" r="1.2"/>
    <circle cx="34" cy="34" r="1.3"/>
    <circle cx="40" cy="22" r="1.2"/>
    <circle cx="45" cy="10" r="1.1"/>
  </g>

  <!-- ── 4. Hand-Carved Jaipur Jaali Lattice & Lotus Petals between R=34 and R=52 ── -->
  <!-- Radiating Pichwai Lotus Petals -->
  <!-- Petal 1 (diagonal) -->
  <path d="M 26,26 C 32,32 38,36 41,33 C 36,38 32,32 26,26 Z" fill="url(#gShade)" stroke="url(#gGold)" stroke-width="0.9"/>
  <path d="M 27,27 L 38,38" fill="none" stroke="url(#gGold)" stroke-width="0.7" opacity="0.8"/>
  <!-- Petal 2 (upper) -->
  <path d="M 22,14 C 29,17 37,17 40,14 C 37,11 29,11 22,14 Z" fill="url(#gShade)" stroke="url(#gGold)" stroke-width="0.85"/>
  <!-- Petal 3 (left) -->
  <path d="M 14,22 C 17,29 17,37 14,40 C 11,37 11,29 14,22 Z" fill="url(#gShade)" stroke="url(#gGold)" stroke-width="0.85"/>

  <!-- ── 5. Outer Scalloped Crown & Flowing Kalka (Paisley) Tendrils (R=65 to 90) ── -->
  <!-- Outer Arch (R=70) -->
  <path d="M 0,70 Q 18,68 28,60 Q 44,60 52,52 Q 60,44 60,28 Q 68,18 70,0" fill="none" stroke="url(#gGold)" stroke-width="1.3" opacity="0.95"/>
  <path d="M 0,74 Q 19,72 30,64 Q 47,64 56,56 Q 64,47 64,30 Q 72,19 74,0" fill="none" stroke="url(#gGold)" stroke-width="0.8" opacity="0.6"/>

  <!-- Flowing Royal Kalka (Paisley / Mango) Scrolls into horizontal and vertical rules -->
  <!-- Horizontal scroll into top border -->
  <path d="M 64,12 C 74,10 84,16 90,14 C 95,12 98,6 94,4 C 88,2 78,8 68,10" fill="none" stroke="url(#gGold)" stroke-width="1.1"/>
  <circle cx="92" cy="13" r="1.4" fill="url(#gGold)"/>
  <path d="M 72,10 Q 76,4 82,6 Q 80,12 76,10" fill="url(#gGold)" opacity="0.8"/>

  <!-- Vertical scroll into left border -->
  <path d="M 12,64 C 10,74 16,84 14,90 C 12,95 6,98 4,94 C 2,88 8,78 10,68" fill="none" stroke="url(#gGold)" stroke-width="1.1"/>
  <circle cx="13" cy="92" r="1.4" fill="url(#gGold)"/>
  <path d="M 10,72 Q 4,76 6,82 Q 12,80 10,76" fill="url(#gGold)" opacity="0.8"/>

  <!-- Delicate pearl droplets on arch tips -->
  <circle cx="52" cy="52" r="1.5" fill="url(#gGold)"/>
  <circle cx="34" cy="62" r="1.2" fill="url(#gGold)"/>
  <circle cx="62" cy="34" r="1.2" fill="url(#gGold)"/>
  <circle cx="18" cy="68" r="1.1" fill="url(#gGold)"/>
  <circle cx="68" cy="18" r="1.1" fill="url(#gGold)"/>
</svg>