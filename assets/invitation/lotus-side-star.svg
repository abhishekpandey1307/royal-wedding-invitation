<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 100" width="30" height="100">
  <defs>
    <linearGradient id="gGoldStar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#623b12"/>
      <stop offset="25%" stop-color="#a87532"/>
      <stop offset="50%" stop-color="#fdf0b4"/>
      <stop offset="75%" stop-color="#a87532"/>
      <stop offset="100%" stop-color="#623b12"/>
    </linearGradient>
  </defs>

  <!-- Upper connecting vertical inner border segment -->
  <line x1="15" y1="0" x2="15" y2="28" stroke="url(#gGoldStar)" stroke-width="1.3"/>
  <!-- Upper bead ring -->
  <circle cx="15" cy="28" r="2.2" fill="url(#gGoldStar)"/>

  <!-- Central 4-pointed Concave Diamond Star (Center at x=15, y=50) -->
  <path d="M 15,36 Q 16.5,47 25,50 Q 16.5,53 15,64 Q 13.5,53 5,50 Q 13.5,47 15,36 Z" fill="none" stroke="url(#gGoldStar)" stroke-width="1.3"/>
  <polygon points="15,44 19,50 15,56 11,50" fill="url(#gGoldStar)"/>

  <!-- Lower bead ring -->
  <circle cx="15" cy="72" r="2.2" fill="url(#gGoldStar)"/>
  <!-- Lower connecting vertical inner border segment -->
  <line x1="15" y1="72" x2="15" y2="100" stroke="url(#gGoldStar)" stroke-width="1.3"/>
</svg>
