  <circle cx="22.5" cy="13.5" r="0.9" fill="#c9a030"/>
  <!-- Auspicious 4-Petaled Gold Floret at inflection center -->
  <polygon points="16,6.2 17.6,8 16,9.8 14.4,8" fill="#c9a030"/>
  <circle cx="16" cy="8" r="0.7" fill="#8f1d2c"/>
  <!-- Moti pearls -->
