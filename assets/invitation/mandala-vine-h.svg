<svg xmlns="http://www.w3.org/2000/svg" width="32" height="16" viewBox="0 0 32 16">
  <defs>
    <linearGradient id="gV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5416"/>
      <stop offset="25%" stop-color="#b88924"/>
      <stop offset="50%" stop-color="#faebaa"/>
      <stop offset="75%" stop-color="#b88924"/>
      <stop offset="100%" stop-color="#7a5416"/>
    </linearGradient>
  </defs>
  <!-- Sinuous Floral Vine Wave -->
  <path d="M 0,8 Q 8,3.2 16,8 Q 24,12.8 32,8" fill="none" stroke="url(#gV)" stroke-width="1.1" opacity="0.9"/>
  <!-- Top Lotus Bud with golden glow fill -->
