<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 132">
  <defs>
    <linearGradient id="gL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7a5c10"/>
      <stop offset="30%"  stop-color="#c4a040"/>
      <stop offset="60%"  stop-color="#f5e98a"/>
      <stop offset="100%" stop-color="#8b6f1e"/>
    </linearGradient>
  </defs>

  <!-- ══ TOP HORIZONTAL CONNECTOR BAR (sits on the outer border line) ══ -->
  <line x1="12" y1="1.5" x2="60" y2="1.5" stroke="url(#gL)" stroke-width="1.2"/>

  <!-- ══════════════ LEFT CHAIN (x=18, length≈88) ══════════════ -->
  <circle cx="18" cy="1.5" r="2.1" fill="url(#gL)"/>
  <line x1="18" y1="3.5" x2="18" y2="78" stroke="url(#gL)" stroke-width="0.8"/>
  <!-- bead pearls along chain -->
  <circle cx="18" cy="24"  r="1.2" fill="url(#gL)"/>
  <circle cx="18" cy="48"  r="1.2" fill="url(#gL)"/>
  <circle cx="18" cy="68"  r="1.0" fill="url(#gL)"/>
  <!-- LOTUS at bottom y≈88 -->
  <!-- main central bud -->
  <path d="M 18,78 C 15.5,76 15,73 16,71 C 17,69 18,69.5 18,72
            C 18,69.5 19,69 20,71 C 21,73 20.5,76 18,78 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.85"/>
  <!-- left side-petal -->
  <path d="M 14.5,76 C 12,74.5 11.5,71.5 13,70 C 14.5,68.5 16,69 16,71 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.7" opacity="0.9"/>
  <!-- right side-petal -->
  <path d="M 21.5,76 C 24,74.5 24.5,71.5 23,70 C 21.5,68.5 20,69 20,71 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.7" opacity="0.9"/>
  <!-- top bud tip -->
  <path d="M 18,69.5 C 16.5,67 18,65 18,67 C 18,65 19.5,67 18,69.5 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.65" opacity="0.8"/>
  <!-- center gem -->
  <circle cx="18" cy="78" r="1.4" fill="url(#gL)"/>

  <!-- ══════════════ CENTER CHAIN (x=36, length≈118, longest) ══════════════ -->
  <circle cx="36" cy="1.5" r="2.1" fill="url(#gL)"/>
  <line x1="36" y1="3.5" x2="36" y2="108" stroke="url(#gL)" stroke-width="0.8"/>
  <!-- bead pearls along chain -->
  <circle cx="36" cy="27"  r="1.2" fill="url(#gL)"/>
  <circle cx="36" cy="54"  r="1.2" fill="url(#gL)"/>
  <circle cx="36" cy="81"  r="1.2" fill="url(#gL)"/>
  <circle cx="36" cy="99"  r="1.0" fill="url(#gL)"/>
  <!-- LOTUS at bottom y≈118 -->
  <path d="M 36,108 C 33.5,106 33,103 34,101 C 35,99 36,99.5 36,102
            C 36,99.5 37,99 38,101 C 39,103 38.5,106 36,108 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.85"/>
  <path d="M 32.5,106 C 30,104.5 29.5,101.5 31,100 C 32.5,98.5 34,99 34,101 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.7" opacity="0.9"/>
  <path d="M 39.5,106 C 42,104.5 42.5,101.5 41,100 C 39.5,98.5 38,99 38,101 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.7" opacity="0.9"/>
  <path d="M 36,99.5 C 34.5,97 36,95 36,97 C 36,95 37.5,97 36,99.5 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.65" opacity="0.8"/>
  <circle cx="36" cy="108" r="1.4" fill="url(#gL)"/>

  <!-- ══════════════ RIGHT CHAIN (x=54, length≈98) ══════════════ -->
  <circle cx="54" cy="1.5" r="2.1" fill="url(#gL)"/>
  <line x1="54" y1="3.5" x2="54" y2="88" stroke="url(#gL)" stroke-width="0.8"/>
  <!-- bead pearls along chain -->
  <circle cx="54" cy="26"  r="1.2" fill="url(#gL)"/>
  <circle cx="54" cy="52"  r="1.2" fill="url(#gL)"/>
  <circle cx="54" cy="76"  r="1.0" fill="url(#gL)"/>
  <!-- LOTUS at bottom y≈98 -->
  <path d="M 54,88 C 51.5,86 51,83 52,81 C 53,79 54,79.5 54,82
            C 54,79.5 55,79 56,81 C 57,83 56.5,86 54,88 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.85"/>
  <path d="M 50.5,86 C 48,84.5 47.5,81.5 49,80 C 50.5,78.5 52,79 52,81 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.7" opacity="0.9"/>
  <path d="M 57.5,86 C 60,84.5 60.5,81.5 59,80 C 57.5,78.5 56,79 56,81 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.7" opacity="0.9"/>
  <path d="M 54,79.5 C 52.5,77 54,75 54,77 C 54,75 55.5,77 54,79.5 Z"
        fill="none" stroke="url(#gL)" stroke-width="0.65" opacity="0.8"/>
  <circle cx="54" cy="88" r="1.4" fill="url(#gL)"/>
</svg>
