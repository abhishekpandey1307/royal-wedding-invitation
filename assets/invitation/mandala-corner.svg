<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="100%" height="100%">
  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5416"/>
      <stop offset="20%" stop-color="#b88924"/>
      <stop offset="45%" stop-color="#faebaa"/>
      <stop offset="65%" stop-color="#d4af37"/>
      <stop offset="85%" stop-color="#b88924"/>
      <stop offset="100%" stop-color="#5c3d00"/>
    </linearGradient>
    <radialGradient id="gRuby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f03e56"/>
      <stop offset="45%" stop-color="#b01326"/>
      <stop offset="85%" stop-color="#6e0614"/>
      <stop offset="100%" stop-color="#3d0008"/>
    </radialGradient>
  </defs>

  <!-- Corner Ornamental Miter Floral Rosette in 16x16 corner bracket -->
  <path d="M 0,16 L 16,16 L 16,0" fill="none" stroke="url(#gGold)" stroke-width="1.0" opacity="0.85"/>
  <circle cx="8" cy="8" r="3.2" fill="none" stroke="url(#gGold)" stroke-width="0.9"/>
  <polygon points="8,4.5 9.5,8 8,11.5 6.5,8" fill="url(#gGold)"/>
  <circle cx="8" cy="8" r="1.3" fill="url(#gRuby)"/>

  <!-- Concentric Radiating Indian Quarter-Mandala from (16,16) -->
  <!-- Ring 1: Inner Scalloped Arch (R=12 from 16,16) -->
  <path d="M 16,28 A 12 12 0 0 1 28,16" fill="none" stroke="url(#gGold)" stroke-width="1.0" opacity="0.9"/>
  <circle cx="21" cy="24.5" r="1.1" fill="url(#gGold)"/>
  <circle cx="24.5" cy="21" r="1.1" fill="url(#gGold)"/>

  <!-- Ring 2: Scalloped Jali Arch (R=22) with Radiating Lotus Petals -->
  <path d="M 16,38 A 22 22 0 0 1 38,16" fill="none" stroke="url(#gGold)" stroke-width="1.1"/>
  <!-- Petals -->
  <path d="M 28,17 C 32,19 35,21 37,19 C 35,17 31,16 28,17 Z" fill="#faebaa" fill-opacity="0.25" stroke="url(#gGold)" stroke-width="0.85"/>
  <path d="M 24,24 C 28,28 33,33 35,31 C 33,29 28,24 24,24 Z" fill="#faebaa" fill-opacity="0.35" stroke="url(#gGold)" stroke-width="0.95"/>
  <path d="M 17,28 C 19,32 21,35 19,37 C 17,35 16,31 17,28 Z" fill="#faebaa" fill-opacity="0.25" stroke="url(#gGold)" stroke-width="0.85"/>

  <!-- Central Corner Imperial Ruby Cabochon at (24.5, 24.5) -->
  <circle cx="24.5" cy="24.5" r="4.2" fill="url(#gGold)"/>
  <circle cx="24.5" cy="24.5" r="3.0" fill="url(#gRuby)"/>
  <circle cx="23.4" cy="23.4" r="0.8" fill="#ffffff" opacity="0.85"/>

  <!-- Ring 3: Scalloped Rajput Jharokha Tips (R=34) -->
  <path d="M 16,50 A 34 34 0 0 1 50,16" fill="none" stroke="url(#gGold)" stroke-width="0.95" opacity="0.85"/>
  <path d="M 16,45 Q 21,46 23,49 Q 28,46 33,46 Q 38,46 42,38 Q 46,33 46,28 Q 46,23 49,21 Q 46,19 45,16" fill="none" stroke="url(#gGold)" stroke-width="0.85" opacity="0.8"/>

  <!-- Ring 4: Outer Pichwai Lotus Crown & Flowing Kalka Tendril (R=48 to 68) -->
  <path d="M 16,64 A 48 48 0 0 1 64,16" fill="none" stroke="url(#gGold)" stroke-width="0.8" opacity="0.65"/>
  <path d="M 20,58 C 30,54 42,46 50,38 C 56,30 60,20 64,18" fill="none" stroke="url(#gGold)" stroke-width="1.2" opacity="0.9"/>
  <path d="M 22,66 C 34,60 48,50 58,40 C 66,30 70,18 70,16" fill="none" stroke="url(#gGold)" stroke-width="0.75" opacity="0.6"/>

  <!-- Delicate Pearls on scrollwork -->
  <circle cx="50" cy="38" r="1.5" fill="url(#gGold)"/>
  <circle cx="64" cy="18" r="1.3" fill="url(#gGold)"/>
  <circle cx="18" cy="64" r="1.3" fill="url(#gGold)"/>
  <circle cx="58" cy="40" r="1.2" fill="url(#gGold)"/>
  <circle cx="34" cy="52" r="1.0" fill="url(#gGold)"/>
  <circle cx="52" cy="34" r="1.0" fill="url(#gGold)"/>
</svg>